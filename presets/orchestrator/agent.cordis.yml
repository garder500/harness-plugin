# Orchestrateur — conduit l'équipe à 4 rôles. Le protocole complet (phases,
# gates, contrats d'artefacts) est dans docs/orchestration.md.
#
# Chaque row tool-subagent ci-dessous crée un sous-agent de rôle dont le
# toolset est limité par `toolFilter.allow`. Les enfants héritent de la
# composition de l'Orchestrateur PUIS sont filtrés par cet allow-list.
#
# NOTE DE CÂBLAGE : les noms listés dans `allow` doivent exister dans la
# session enfant. Les plugins de rôle sont montés au niveau hôte (rows
# `./plugins/*/index.js` dans cordis.patch.yml), donc leurs tools sont visibles
# par chaque enfant ; les listes ci-dessous les attribuent par rôle :
# architect → tree_inspector, ast_analyzer, diagram_renderer, chunk_reader,
# grep_search ; developer → chunk_reader, grep_search ; tester → run_tests,
# coverage_analyzer, run_linter ; designer → visual_capture,
# design_tokens_parser, a11y_validator.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are the ORCHESTRATOR of a modular 4-role development team running on the DeepSeek Harness. Your working directory is {{cwd}}.

      ROLES: architect (system & backend, contracts), developer (core implementation), tester (QA, TDD, coverage, lint), designer (UI/UX, tokens, a11y, visual capture).

      PROTOCOL (docs/orchestration.md):
      1. Cadrage — subagent_architect writes specs/api-contract.md, subagent_designer writes specs/ui-contract.md; both sign specs/acceptance.md.
      2. TDD — subagent_tester writes failing test suites in tests/ from the contracts only (red).
      3. Code — subagent_developer implements in src/ until the suite is green.
      4. Validation — subagent_designer captures visuals + a11y report; subagent_tester runs the full suite + coverage and blocks non-conforming merges.

      Run the phases in order; each delegation must name its contract artifacts by exact path. Verify gates (red→green, coverage, lint) before advancing a phase. Use todo_write to track the phase state.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell / filesystem (tous rôles) ──────────────────────────────────────────
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── suivi / questions ────────────────────────────────────────────────────────
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── délégation par rôle : chaque enfant ne voit QUE son allow-list ───────────
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: subagent-architect
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_architect
        enableRunInBackground: false
        maxDepth: provider-managed
        toolFilter:
          allow: [read, write, glob, grep, pwsh, todo_write, ask_user_question, web_search, tree_inspector, ast_analyzer, diagram_renderer, chunk_reader, grep_search]

    - id: subagent-developer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_developer
        enableRunInBackground: false
        maxDepth: provider-managed
        toolFilter:
          allow: [read, write, edit, glob, grep, pwsh, todo_write, ask_user_question, chunk_reader, grep_search]

    - id: subagent-tester
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_tester
        enableRunInBackground: false
        maxDepth: provider-managed
        toolFilter:
          allow: [read, write, glob, grep, pwsh, todo_write, ask_user_question, run_tests, coverage_analyzer, run_linter]

    - id: subagent-designer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_designer
        enableRunInBackground: false
        maxDepth: provider-managed
        toolFilter:
          allow: [read, write, glob, grep, pwsh, todo_write, ask_user_question, visual_capture, design_tokens_parser, a11y_validator]

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── plan mode ────────────────────────────────────────────────────────────────
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
