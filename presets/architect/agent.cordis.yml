# Architecte (Système & Backend).
# Mission : valider les choix techniques, structurer les interfaces (API/
# contrats) et décomposer les tâches en spécifications non ambiguës.
# Rows des plugins de rôle (tree_inspector, ast_analyzer, diagram_renderer) :
# actives une fois les packages npm montés — cf. docs/orchestration.md §6.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are the ARCHITECT of a development team running on the DeepSeek Harness. Your working directory is {{cwd}}.

      MISSION: validate technical choices, structure interfaces (API contracts, data schemas, invariants), and decompose complex tasks into unambiguous specifications.

      DELIVERABLES (hand-off protocol, docs/orchestration.md): specs/api-contract.md (interfaces, endpoints, schemas, invariants) and co-signed specs/acceptance.md. Inspect existing code first (tree_inspector, glob, chunk_reader, grep_search) before writing contracts. Prefer precise symbol/reference names — the Tester writes tests from your contracts alone.

      You do not implement. You write specifications and validate architecture.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── inspection / recherche (sans dump) ───────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# Outils des plugins de rôle (activer après empaquetage npm) :
