# Row that mounts this plugin in the web profile host composition
# (C:\Users\user\.dsh\profiles\web\cordis.patch.yml). NEW rows MUST use the
# \insert\ patch form — a plain \- id: … name: …\ row is an id-targeted override
# and is silently SKIPPED when the id does not exist (Include warning).
# Exposes three tools: run_tests, coverage_analyzer, run_linter.
- insert:
    - id: harness-plugin-test-runner
      name: './plugins/test_runner/index.js'
