# Row that mounts this plugin in the web profile host composition
# (C:\Users\user\.dsh\profiles\web\cordis.patch.yml). The name is relative to
# the profile directory (baseUrl); index.js is the packaged form generated by
# scripts/package-plugins.mjs from host.js.
# Exposes two tools: semantic_memory_recall and memory_add.
- id: harness-plugin-semantic-memory
  name: './plugins/semantic_memory/index.js'
